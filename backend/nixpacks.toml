[phases.setup]
nixPkgs = ["python312", "cairo", "pango", "gdk-pixbuf", "shared-mime-info", "fontconfig", "freetype", "zlib", "gcc"]

[phases.install]
cmds = ["python -m venv /app/.venv", ". /app/.venv/bin/activate && pip install -r requirements.txt"]

[start]
cmd = "gunicorn folioforge_api.wsgi:application --bind 0.0.0.0:${PORT:-8080}"
